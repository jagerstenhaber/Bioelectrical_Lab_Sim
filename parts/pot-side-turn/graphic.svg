<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -44 84 52" width="84" height="52">
  <defs>
    <linearGradient id="potMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="potShaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Side-Facing Knurled Shaft & Threaded Bushing (pointing upward/sideways from board) -->
  <rect x="23" y="-43" width="18" height="14" rx="2" fill="url(#potShaft)" stroke="#475569" stroke-width="1"/>
  <!-- Knurl lines on shaft -->
  <line x1="26" y1="-42" x2="26" y2="-30" stroke="#64748b" stroke-width="0.9"/>
  <line x1="29" y1="-42" x2="29" y2="-30" stroke="#64748b" stroke-width="0.9"/>
  <line x1="32" y1="-42" x2="32" y2="-30" stroke="#334155" stroke-width="1.3"/>
  <line x1="35" y1="-42" x2="35" y2="-30" stroke="#64748b" stroke-width="0.9"/>
  <line x1="38" y1="-42" x2="38" y2="-30" stroke="#64748b" stroke-width="0.9"/>
  <!-- Threaded collar -->
  <rect x="21" y="-29" width="22" height="5" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <!-- Main Cylindrical/Box Potentiometer Housing viewed from above -->
  <rect x="-6" y="-24" width="76" height="17" rx="3.5" fill="url(#potMetal)" stroke="#334155" stroke-width="1.3"/>
  <!-- Phenolic Base Wafer -->
  <rect x="-4" y="-10" width="72" height="5" rx="1" fill="#92400e" stroke="#78350f" stroke-width="0.9"/>

  <!-- 3 Metal Leads Going Into Holes at x=0, x=32 (2 pitches), x=64 (4 pitches) -->
  <line x1="0"  y1="-6" x2="0"  y2="0" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="32" y1="-6" x2="32" y2="0" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="64" y1="-6" x2="64" y2="0" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Pin Solder/Contact Pads at (0,0), (32,0), (64,0) -->
  <circle cx="0"  cy="0" r="3.5" fill="#eab308" stroke="#a16207" stroke-width="0.9"/>
  <circle cx="32" cy="0" r="3.5" fill="#38bdf8" stroke="#0369a1" stroke-width="0.9"/>
  <circle cx="64" cy="0" r="3.5" fill="#eab308" stroke="#a16207" stroke-width="0.9"/>

  <!-- Labels & Side-Turn Arrows -->
  <text x="32" y="-14" fill="#0f172a" font-family="sans-serif" font-weight="800" font-size="6.2" text-anchor="middle">SIDE POT</text>
  <text x="2"  y="-13" fill="#1e293b" font-family="monospace" font-weight="800" font-size="6" text-anchor="start">1</text>
  <text x="32" y="-3"  fill="#fef08a" font-family="monospace" font-weight="800" font-size="5.5" text-anchor="middle">W</text>
  <text x="62" y="-13" fill="#1e293b" font-family="monospace" font-weight="800" font-size="6" text-anchor="end">3</text>
</svg>
