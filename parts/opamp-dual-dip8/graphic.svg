<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9 -5 66 58" width="66" height="58">
  <!-- Metallic DIP-8 IC Legs at y=0 (Pins 8,7,6,5) and y=48 (Pins 1,2,3,4) -->
  <g fill="#cbd5e1" stroke="#475569" stroke-width="0.8">
    <!-- Top Row Pins: 8 (x=0), 7 (x=16), 6 (x=32), 5 (x=48) -->
    <rect x="-2.8" y="-2.8" width="5.6" height="7" rx="1"/>
    <rect x="13.2" y="-2.8" width="5.6" height="7" rx="1"/>
    <rect x="29.2" y="-2.8" width="5.6" height="7" rx="1"/>
    <rect x="45.2" y="-2.8" width="5.6" height="7" rx="1"/>

    <!-- Bottom Row Pins: 1 (x=0), 2 (x=16), 3 (x=32), 4 (x=48) -->
    <rect x="-2.8" y="43.8" width="5.6" height="7" rx="1"/>
    <rect x="13.2" y="43.8" width="5.6" height="7" rx="1"/>
    <rect x="29.2" y="43.8" width="5.6" height="7" rx="1"/>
    <rect x="45.2" y="43.8" width="5.6" height="7" rx="1"/>
  </g>

  <!-- Molded Matte Black DIP-8 Package Body -->
  <rect x="-7" y="3" width="62" height="42" rx="2.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.4"/>
  <rect x="-5.5" y="4.5" width="59" height="39" rx="1.5" fill="none" stroke="#334155" stroke-width="0.8"/>

  <!-- Left Orientation Notch & Pin 1 Indicator Dot -->
  <path d="M -7 19 A 5 5 0 0 1 -7 29" fill="#0f172a" stroke="#475569" stroke-width="0.9"/>
  <circle cx="-1.5" cy="39.5" r="1.6" fill="#f8fafc"/>

  <!-- =====================================================================
       Top-of-Chip Internal Dual Op-Amp Pinout Schematic Drawing
       ===================================================================== -->
  <!-- Power Pin 8 (V+) at Top-Left (0, 0) -->
  <line x1="0" y1="3" x2="0" y2="8.5" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="1" y="13.5" fill="#fca5a5" font-family="monospace" font-weight="800" font-size="5.5">V+</text>

  <!-- Ground Pin 4 (V-) at Bottom-Right (48, 48) -->
  <line x1="48" y1="45" x2="48" y2="39.5" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="41.5" y="38" fill="#93c5fd" font-family="monospace" font-weight="800" font-size="5.5">V-</text>

  <!-- OP-AMP B (Top Side: Pin 7=OUT2 at x=16, Pin 6=IN2- at x=32, Pin 5=IN2+ at x=48) -->
  <g stroke="#bae6fd" stroke-width="1.05" fill="none" stroke-linejoin="round">
    <!-- Triangle pointing left (tip at x=20, y=14; base at x=33, y=7.5..20.5) -->
    <polygon points="19.5,14 33,7.5 33,20.5" fill="rgba(56,189,248,0.14)" stroke="#7dd3fc" stroke-width="1.1"/>
    <!-- Output trace from tip (19.5, 14) to Pin 7 (16, 3) -->
    <polyline points="19.5,14 16,14 16,3"/>
    <!-- Inverting input (-) trace from Pin 6 (32, 3) into top-right of triangle (33, 10.5) -->
    <polyline points="32,3 32,6 36,6 36,10.5 33,10.5"/>
    <!-- Non-inverting input (+) trace from Pin 5 (48, 3) into bottom-right of triangle (33, 17.5) -->
    <polyline points="48,3 48,17.5 33,17.5"/>
  </g>
  <!-- Op-Amp B +/- symbols -->
  <text x="30.2" y="12.2" fill="#fca5a5" font-family="monospace" font-weight="800" font-size="6" text-anchor="middle">−</text>
  <text x="30.2" y="19.2" fill="#86efac" font-family="monospace" font-weight="800" font-size="5.8" text-anchor="middle">+</text>

  <!-- OP-AMP A (Bottom Side: Pin 1=OUT1 at x=0, Pin 2=IN1- at x=16, Pin 3=IN1+ at x=32) -->
  <g stroke="#bae6fd" stroke-width="1.05" fill="none" stroke-linejoin="round">
    <!-- Triangle pointing left (tip at x=5.5, y=33; base at x=19, y=26.5..39.5) -->
    <polygon points="5.5,33 19,26.5 19,39.5" fill="rgba(56,189,248,0.14)" stroke="#7dd3fc" stroke-width="1.1"/>
    <!-- Output trace from tip (5.5, 33) to Pin 1 (0, 45) -->
    <polyline points="5.5,33 0,33 0,45"/>
    <!-- Inverting input (-) trace from Pin 2 (16, 45) into bottom of triangle (19, 36) -->
    <polyline points="16,45 16,42 22,42 22,36 19,36"/>
    <!-- Non-inverting input (+) trace from Pin 3 (32, 45) into top of triangle (19, 29.5) -->
    <polyline points="32,45 32,29.5 19,29.5"/>
  </g>
  <!-- Op-Amp A +/- symbols -->
  <text x="16.2" y="31.5" fill="#86efac" font-family="monospace" font-weight="800" font-size="5.8" text-anchor="middle">+</text>
  <text x="16.2" y="38.2" fill="#fca5a5" font-family="monospace" font-weight="800" font-size="6" text-anchor="middle">−</text>
</svg>
