<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9 -7 34 46" width="34" height="46">
  <!-- Blue Square Trimpot Plastic Housing -->
  <rect x="-7" y="-5" width="30" height="42" rx="3" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.3"/>
  <rect x="-5" y="-3" width="26" height="38" rx="2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.7"/>

  <!-- Subtle internal trace hints to triangle pins (0,0), (16,16), (0,32) -->
  <line x1="0" y1="0"  x2="5" y2="10" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  <line x1="0" y1="32" x2="5" y2="22" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  <line x1="16" y1="16" x2="11" y2="16" stroke="rgba(56,189,248,0.6)" stroke-width="1.2"/>

  <!-- Top-Turn Rotary Dial & Screwdriver Slot (centered at x=8, y=16) -->
  <circle cx="8" cy="16" r="10.2" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
  <circle cx="8" cy="16" r="7.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.7"/>
  <!-- Cross screwdriver slot + directional arrow -->
  <line x1="8" y1="9.5" x2="8" y2="22.5" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="2.5" y1="16" x2="13.5" y2="16" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="8,7.8 5.8,11 10.2,11" fill="#dc2626"/>

  <!-- Triangle Pin Pads: Pin 1 at (0,0), Pin 2 (Wiper) at (16,16), Pin 3 at (0,32) -->
  <circle cx="0"  cy="0"  r="3.2" fill="#eab308" stroke="#a16207" stroke-width="0.9"/>
  <circle cx="16" cy="16" r="3.4" fill="#38bdf8" stroke="#0369a1" stroke-width="0.9"/>
  <circle cx="0"  cy="32" r="3.2" fill="#eab308" stroke="#a16207" stroke-width="0.9"/>

  <!-- Pin Labels -->
  <text x="6.5" y="1"  fill="#bfdbfe" font-family="monospace" font-weight="800" font-size="5.2">1</text>
  <text x="20"  y="13" fill="#7dd3fc" font-family="monospace" font-weight="800" font-size="5.2">W</text>
  <text x="6.5" y="34" fill="#bfdbfe" font-family="monospace" font-weight="800" font-size="5.2">3</text>
</svg>
