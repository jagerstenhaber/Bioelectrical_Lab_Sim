<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -10 252 116" width="252" height="116">
  <defs>
    <linearGradient id="nanoPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6e8a"/>
      <stop offset="100%" stop-color="#074f66"/>
    </linearGradient>
    <linearGradient id="usbMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- PCB Board -->
  <rect x="-10" y="-8" width="244" height="112" rx="4" fill="url(#nanoPcb)" stroke="#053b4c" stroke-width="1.5"/>

  <!-- Inner White Silkscreen Border -->
  <rect x="-6" y="-5" width="236" height="106" rx="2" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>

  <!-- Corner Mounting Holes -->
  <circle cx="-4" cy="0" r="2.6" fill="#0f172a" stroke="#eab308" stroke-width="1.2"/>
  <circle cx="228" cy="0" r="2.6" fill="#0f172a" stroke="#eab308" stroke-width="1.2"/>
  <circle cx="-4" cy="96" r="2.6" fill="#0f172a" stroke="#eab308" stroke-width="1.2"/>
  <circle cx="228" cy="96" r="2.6" fill="#0f172a" stroke="#eab308" stroke-width="1.2"/>

  <!-- Mini/Micro USB Connector on Left Overhang (by D12 / D13) -->
  <rect x="-14" y="29" width="26" height="38" rx="3" fill="url(#usbMetal)" stroke="#475569" stroke-width="1.2"/>
  <rect x="-11" y="34" width="18" height="28" rx="1.5" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <line x1="-6" y1="40" x2="-6" y2="56" stroke="#475569" stroke-width="1.2"/>

  <!-- Status LEDs (TX, RX, PWR, L) near USB side -->
  <g transform="translate(36, 33)">
    <rect x="0" y="0" width="6" height="3.5" rx="0.8" fill="#fef08a" stroke="#ca8a04" stroke-width="0.6"/>
    <text x="3" y="9" fill="#cbd5e1" font-family="monospace" font-size="4.5" text-anchor="middle">TX</text>

    <rect x="12" y="0" width="6" height="3.5" rx="0.8" fill="#fef08a" stroke="#ca8a04" stroke-width="0.6"/>
    <text x="15" y="9" fill="#cbd5e1" font-family="monospace" font-size="4.5" text-anchor="middle">RX</text>

    <rect x="0" y="19" width="6" height="3.5" rx="0.8" fill="#86efac" stroke="#16a34a" stroke-width="0.6"/>
    <text x="3" y="28" fill="#cbd5e1" font-family="monospace" font-size="4.5" text-anchor="middle">ON</text>

    <rect x="12" y="19" width="6" height="3.5" rx="0.8" fill="#fde047" stroke="#ca8a04" stroke-width="0.6"/>
    <text x="15" y="28" fill="#cbd5e1" font-family="monospace" font-size="4.5" text-anchor="middle">L</text>
  </g>

  <!-- Rotated ATmega328P QFP Chip -->
  <g transform="translate(106, 48) rotate(45)">
    <rect x="-16" y="-20" width="32" height="40" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2 2"/>
    <rect x="-20" y="-16" width="40" height="32" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2 2"/>
    <rect x="-16" y="-16" width="32" height="32" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
    <circle cx="-10" cy="-10" r="2" fill="#475569"/>
    <text x="0" y="-2" fill="#94a3b8" font-family="monospace" font-size="4.5" text-anchor="middle">ATMEGA</text>
    <text x="0" y="4" fill="#94a3b8" font-family="monospace" font-size="4.5" text-anchor="middle">328P</text>
  </g>

  <!-- Reset Tactile Button -->
  <rect x="156" y="38" width="18" height="20" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <circle cx="165" cy="48" r="5.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="165" cy="48" r="3.5" fill="#dc2626"/>
  <text x="165" y="65" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="5" text-anchor="middle">RESET</text>

  <!-- ICSP 6-Pin Header on Right (by TX1 / VIN) -->
  <g transform="translate(208, 34)">
    <rect x="-4" y="-3" width="18" height="34" rx="1.5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <circle cx="1" cy="3" r="1.8" fill="#eab308"/>
    <circle cx="9" cy="3" r="1.8" fill="#eab308"/>
    <circle cx="1" cy="14" r="1.8" fill="#eab308"/>
    <circle cx="9" cy="14" r="1.8" fill="#eab308"/>
    <circle cx="1" cy="25" r="1.8" fill="#eab308"/>
    <circle cx="9" cy="25" r="1.8" fill="#eab308"/>
    <text x="5" y="-5" fill="#e2e8f0" font-family="monospace" font-size="4.5" text-anchor="middle">ICSP</text>
  </g>

  <!-- Board Title Silkscreen -->
  <text x="64" y="26" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="7.5" letter-spacing="0.6">ARDUINO</text>
  <text x="64" y="75" fill="#bae6fd" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="1.2">NANO</text>

  <!-- Top Row Gold Pads & Silkscreen Labels (y = 0): D12 .. TX1 -->
  <g fill="#eab308" stroke="#a16207" stroke-width="0.8">
    <circle cx="0" cy="0" r="3.4"/>
    <circle cx="16" cy="0" r="3.4"/>
    <circle cx="32" cy="0" r="3.4"/>
    <circle cx="48" cy="0" r="3.4"/>
    <circle cx="64" cy="0" r="3.4"/>
    <circle cx="80" cy="0" r="3.4"/>
    <circle cx="96" cy="0" r="3.4"/>
    <circle cx="112" cy="0" r="3.4"/>
    <circle cx="128" cy="0" r="3.4"/>
    <circle cx="144" cy="0" r="3.4"/>
    <circle cx="160" cy="0" r="3.4"/>
    <circle cx="176" cy="0" r="3.4"/>
    <circle cx="192" cy="0" r="3.4"/>
    <circle cx="208" cy="0" r="3.4"/>
    <!-- Square pad for Pin 1 (TX1) at top-right -->
    <rect x="220.6" y="-3.4" width="6.8" height="6.8" rx="1"/>
  </g>
  <g fill="#f8fafc" font-family="monospace" font-weight="700" font-size="5.2" text-anchor="middle">
    <text x="0" y="11">D12</text>
    <text x="16" y="11">D11</text>
    <text x="32" y="11">D10</text>
    <text x="48" y="11">D9</text>
    <text x="64" y="11">D8</text>
    <text x="80" y="11">D7</text>
    <text x="96" y="11">D6</text>
    <text x="112" y="11">D5</text>
    <text x="128" y="11">D4</text>
    <text x="144" y="11">D3</text>
    <text x="160" y="11">D2</text>
    <text x="176" y="11" fill="#93c5fd">GND</text>
    <text x="192" y="11">RST</text>
    <text x="208" y="11">RX0</text>
    <text x="224" y="11">TX1</text>
  </g>

  <!-- Bottom Row Gold Pads & Silkscreen Labels (y = 96): D13 .. VIN -->
  <g fill="#eab308" stroke="#a16207" stroke-width="0.8">
    <circle cx="0" cy="96" r="3.4"/>
    <circle cx="16" cy="96" r="3.4"/>
    <circle cx="32" cy="96" r="3.4"/>
    <circle cx="48" cy="96" r="3.4"/>
    <circle cx="64" cy="96" r="3.4"/>
    <circle cx="80" cy="96" r="3.4"/>
    <circle cx="96" cy="96" r="3.4"/>
    <circle cx="112" cy="96" r="3.4"/>
    <circle cx="128" cy="96" r="3.4"/>
    <circle cx="144" cy="96" r="3.4"/>
    <circle cx="160" cy="96" r="3.4"/>
    <circle cx="176" cy="96" r="3.4"/>
    <circle cx="192" cy="96" r="3.4"/>
    <circle cx="208" cy="96" r="3.4"/>
    <circle cx="224" cy="96" r="3.4"/>
  </g>
  <g fill="#f8fafc" font-family="monospace" font-weight="700" font-size="5.2" text-anchor="middle">
    <text x="0" y="89">D13</text>
    <text x="16" y="89" fill="#fca5a5">3V3</text>
    <text x="32" y="89">REF</text>
    <text x="48" y="89">A0</text>
    <text x="64" y="89">A1</text>
    <text x="80" y="89">A2</text>
    <text x="96" y="89">A3</text>
    <text x="112" y="89">A4</text>
    <text x="128" y="89">A5</text>
    <text x="144" y="89">A6</text>
    <text x="160" y="89">A7</text>
    <text x="176" y="89" fill="#fca5a5">5V</text>
    <text x="192" y="89">RST</text>
    <text x="208" y="89" fill="#93c5fd">GND</text>
    <text x="224" y="89" fill="#fca5a5">VIN</text>
  </g>
</svg>
